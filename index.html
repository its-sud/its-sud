<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optic Hell</title>
    <style>
        /* CSS: Styling the Grid */
        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
        /*
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .gallery img:hover { transform: scale(1.03); }
        */
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px;}
        .gallery-item { 
            flex-grow: 1; /* Lets the rows scale fluidly */
            height: 250px; /* Set the standard target height for your rows */
            object-fit: contain; /* So the file uses its real aspect ratio */
            width: auto;
            min-width: 150px;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
            z-index: 2; /* Ensures the zoomed item doesn't cut behind others */
        }
        
        /* Optional: Clean fix for the final row so it doesn't over-stretch */
        .gallery::after {
            content: "";
            flex-grow: 99999; /* Acts as an invisible spacer at the end */
        }

        /* CSS: The Lightbox Pop-up Overlay */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000;}
        .lightbox img { max-width: 90%; max-height: 80%; border: 3px solid #fff; }

        /* CSS: Clean Minimalist Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.85rem;
            color: #666; /* Subtle muted gray so it doesn't distract from your art */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>Optic Hell</h1>
    
    <!-- HTML: The Gallery Grid -->
    <div class="gallery">
        <img src="./images/bird.jpg" alt="bird" class="gallery-item">
        <img src="./images/dog.jpg" alt="dog" class="gallery-item">
        <img src="./images/fashion.jpg" alt="fashion" class="gallery-item">
        <img src="./images/market.jpg" alt="market" class="gallery-item">
        <img src="./images/reflections.jpg" alt="reflections" class="gallery-item">
        <img src="./images/sea.jpg" alt="sea" class="gallery-item">
        <img src="./images/shadows.jpg" alt="shadows" class="gallery-item">
        <img src="./images/ship.jpg" alt="ship" class="gallery-item">
        <img src="./images/soccer.jpg" alt="soccer" class="gallery-item">
        <img src="./images/street.jpg" alt="street" class="gallery-item">
        <img src="./images/sunset.jpg" alt="sunset" class="gallery-item">
        <img src="./images/temple.jpg" alt="temple" class="gallery-item">
    </div>

    <!-- HTML: The Hidden Lightbox Box -->
    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" src="" alt="Enlarged view">
    </div>
    
    <!-- HTML: Footer section at the bottom -->
    <footer>
        <p>&copy; <span id="year"></span> Optic Hell Photography Page. All rights reserved.</p>
    </footer>
    
    <script>
        // JAVASCRIPT: Making it Interactive
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const images = document.querySelectorAll('.gallery-item');

        // Open lightbox when a photo is clicked
        images.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        // Close lightbox when the dark background is clicked
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        // Automatically set the current calendar year
        const yearSpan = document.getElementById('year');
        yearSpan.textContent = new Date().getFullYear();

    </script>
</body>
</html>
